<!doctype html>
<html>
  <head><meta charset="utf-8"><title>ReconX — Generate & Download</title></head>
  <body style="font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1720;color:#fff">
    <div style="text-align:center;background:#071018;padding:28px;border-radius:8px">
      <h2>ReconX — Generate & Download Report</h2>
      <p>Enter target and click generate (quick scan: ports 1-1024)</p>
      <form action="/generate-and-download/" method="get" onsubmit="event.preventDefault(); location.href='/generate-and-download/'+encodeURIComponent(document.getElementById('t').value);">
        <input id="t" placeholder="example.com or 127.0.0.1" style="padding:8px;width:220px" />
        <button type="submit" style="padding:8px 12px;margin-left:8px">Generate & Download</button>
      </form>
      <p style="color:#9fb7a9;font-size:13px;margin-top:12px">Use only on authorized targets.</p>
    </div>
  </body>
</html>
