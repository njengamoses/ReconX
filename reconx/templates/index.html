<!doctype html>
<html>
  <head>

    <title>ReconX — Download Report</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;background:#0f1720;color:#e6edf3;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
      .card{background:#0b1220;padding:28px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5);text-align:center}

      p.small{color:#9fb7a9;margin-top:12px;font-size:13px}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>ReconX Report</h2>
      <p>Click to download the latest available report.</p>
      <a class="btn" href="/download">⬇ Download Latest Report</a>
      <p class="small">Ensure the report file exists in <code>examples/</code>.</p>
    </div>
  </body>
</html>
